name: 비공개 쇼츠 자동 예약

on:
  schedule:
    - cron: "17 * * * *"   # 매시간
  workflow_dispatch:
    inputs:
      dry_run:
        description: "연습 모드 (예약하지 않고 계획만 보기)"
        type: boolean
        default: true

concurrency:
  group: schedule-shorts
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 예약
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 정기 실행은 저장소 변수 SCHEDULER_ENABLED 가 false 이면 계획만 보여줘요.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'schedule' && vars.SCHEDULER_ENABLED == 'false') }}
        run: python schedule.py
