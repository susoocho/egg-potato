/* Layout: one-screen phone app. Swipe deck on top, bottom tab bar. Egg yolk = 찜, potato = 촬영. */
:root{

  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141317; --surface:#1F1D24; --ink:#F2F0F5; --muted:#A29EAB; --line:#2F2C36;
  --yolk:#FFC933; --yolk-ink:#2A1E00; --potato:#C9945F; --like:#FF6690; --pass:#7B7785;
  --chip:#2A2730; --est:#A98BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141317; --surface:#1F1D24; --ink:#F2F0F5; --muted:#A29EAB; --line:#2F2C36;
  --yolk:#FFC933; --yolk-ink:#2A1E00; --potato:#C9945F; --like:#FF6690; --pass:#7B7785;
  --chip:#2A2730; --est:#A98BFF; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
html{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
header h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:-.3px;flex:1}
header h1 b{color:var(--potato);font-weight:400}
.goal{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.goal strong{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--chip);margin:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.bar i{display:block;height:100%;background:var(--yolk);width:0;transition:width .3s}
main{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 16px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{all:unset;cursor:pointer;text-align:center;padding:10px 0 12px;font-size:13px;color:var(--muted);font-weight:500}
nav button span{display:block;font-family:var(--display);font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] span{color:var(--potato)}
nav button:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}

/* deck */
.deck{position:relative;height:100%;min-height:440px;display:flex;flex-direction:column}
.stack{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--surface);border-radius:22px;box-shadow:0 10px 30px rgba(20,10,30,.12);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none}
.card.behind{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.poster{position:relative;padding:18px 18px 14px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.poster .plat{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;letter-spacing:.6px;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:99px}
.poster .views{position:absolute;top:10px;right:14px;text-align:right;font-family:var(--display);font-size:28px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.poster .views small{display:block;font-family:var(--body);font-size:11px;opacity:.9}
.poster h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.poster .en{font-size:12px;opacity:.92}
.play{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 16px 0;padding:11px;border-radius:14px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px}
.body{padding:12px 16px 8px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--ink)}
.tag.hot{background:var(--yolk);color:var(--yolk-ink);font-weight:700}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
.charm{font-family:var(--display);font-size:19px;line-height:1.35}
.est{font-family:var(--body);font-size:11px;color:var(--est);border:1px solid var(--est);padding:0 6px;border-radius:99px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.why{font-size:14px;color:var(--ink)}
.meta{font-size:12px;color:var(--muted)}
.refs a{color:var(--ink);font-size:13px}
.refs{display:flex;flex-direction:column;gap:2px}
.stamp{position:absolute;top:22px;font-family:var(--display);font-size:34px;padding:2px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-12deg);pointer-events:none}
.stamp.like{left:18px;color:var(--like);border-color:var(--like);background:rgba(255,255,255,.85)}
.stamp.nope{right:18px;color:var(--pass);border-color:var(--pass);background:rgba(255,255,255,.85);transform:rotate(12deg)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding-top:12px}
.actions button{all:unset;cursor:pointer;text-align:center;padding:13px 0;border-radius:16px;font-weight:700;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.actions .b-like{background:var(--like);color:#fff;border-color:transparent}
.actions .b-res{color:var(--potato)}
.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);margin-bottom:6px}

/* lists */
.sec-h{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}
.sec-h h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sec-h p{margin:0;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px;border:1px solid var(--line)}
.sw{width:52px;height:52px;border-radius:12px}
.item h4{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.item .sub{font-size:12px;color:var(--muted)}
.item .prog{font-size:12px;color:var(--potato);font-weight:700}
.item > div{min-width:0}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;background:var(--chip);white-space:nowrap}
.btn.yolk{background:var(--yolk);color:var(--yolk-ink)}
.mini{display:flex;gap:6px}
.note{font-size:12px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:14px}
.passed{margin-top:18px}
.passed summary{cursor:pointer;font-size:13px;color:var(--muted)}

/* shoot sheet */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(10,8,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.panel h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 2px}
.panel .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--potato);flex:none;margin:1px 0 0}
.chk.done span{color:var(--muted);text-decoration:line-through}
.panel .lbl{margin-top:14px}
.panel .close{display:block;width:100%;margin-top:16px;text-align:center;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.player{position:relative;background:#000;flex:0 0 auto;height:58%;min-height:300px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .out{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;text-decoration:none}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px 0}.ttl b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;min-width:0}.ttl span{font-size:12px;color:var(--muted);white-space:nowrap}
.play{border:0;cursor:pointer;font-family:inherit}
</style>

function embedUrl(u){let m=u.match(/youtube\.com\/shorts\/([\w-]{11})/);if(m)return `https://www.youtube.com/embed/${m[1]}?autoplay=1&playsinline=1&rel=0`;
 m=u.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);if(m)return `https://www.tiktok.com/player/v1/${m[1]}?autoplay=1&music_info=1&description=1`;return null;}
TRENDS.forEach(t=>t.kind='feed');RESERVE.forEach(t=>t.kind='reserve');
const ALL=[...TRENDS,...RESERVE];const byId=Object.fromEntries(ALL.map(t=>[t.id,t]));

const KEY='eggpotato-picker-v1';
let S={status:{},checks:{},tab:'feed'};

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st=id=>S.status[id]||(byId[id].kind==='reserve'?'reserve':'new');

const grad=t=>`linear-gradient(135deg,hsl(${t.hue[0]} 78% 56%),hsl(${t.hue[1]} 80% 50%))`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function counts(){
  const n={feed:0,picks:0,reserve:0};
  ALL.forEach(t=>{const s=st(t.id);if(s==='new')n.feed++;else if(s==='like')n.picks++;else if(s==='reserve')n.reserve++;});
  return n;
}
function render(){
  const n=counts();
  document.getElementById('c-feed').textContent=n.feed;
  document.getElementById('c-picks').textContent=n.picks;
  document.getElementById('c-reserve').textContent=n.reserve;
  document.getElementById('goalNum').textContent=`${n.picks} / 38`;
  document.getElementById('goalBar').style.width=Math.min(100,n.picks/38*100)+'%';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  const v=document.getElementById('view');
  if(S.tab==='feed')renderFeed(v);else if(S.tab==='picks')renderPicks(v);else renderReserve(v);
}

function cardHTML(t){
  return `<div class="poster" style="background:${grad(t)}">
    <span class="plat">${t.plat}</span>
    <div class="views">${esc(t.views)}<small>${esc(t.viewsNote)}</small></div>
    <h2>${esc(t.title)}</h2><div class="en">${esc(t.en)}</div>
  </div>
  ${embedUrl(t.url)?`<button class="play" data-play="${t.id}">▶ 여기서 바로 보기</button>`:`<a class="play" href="${t.url}" target="_blank" rel="noopener">▶ ${t.plat}에서 찾아보기</a>`}
  <div class="body">
    <div class="row">${t.tags.map(g=>`<span class="tag${g==='급상승'?' hot':''}">${esc(g)}</span>`).join('')}</div>
    <div><div class="lbl">이 영상의 매력</div><div class="charm">${esc(t.charm)}<span class="est">추정</span></div></div>
    <div><div class="lbl">뜨는 이유</div><div class="why">${esc(t.why)}</div></div>
    <div class="meta">음원: ${esc(t.sound)}</div>
    ${t.refs.length?`<div class="refs"><div class="lbl">비슷하게 터진 영상</div>${t.refs.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])}</a>`).join('')}</div>`:''}
  </div>
  <span class="stamp like">찜</span><span class="stamp nope">패스</span>`;
}

function renderFeed(v){
  const q=ALL.filter(t=>st(t.id)==='new');
  if(!q.length){v.innerHTML=`<div class="empty"><b>이번 피드는 다 골랐어요</b>찜한 건 '찜 · 촬영 리스트'에, 모자라면 예비함에서 꺼내세요.</div>`;return;}
  v.innerHTML=`<div class="deck"><div class="stack" id="stack"></div>
    <div class="actions"><button class="b-pass" id="b-pass">패스</button><button class="b-res" id="b-res">예비함</button><button class="b-like" id="b-like">찜 ♥</button></div></div>`;
  const stack=document.getElementById('stack');
  if(q[1]){const b=document.createElement('div');b.className='card behind';b.innerHTML=cardHTML(q[1]);stack.appendChild(b);}
  const c=document.createElement('div');c.className='card';c.innerHTML=cardHTML(q[0]);stack.appendChild(c);
  const top=q[0];
  document.getElementById('b-pass').onclick=()=>decide(top.id,'pass',c,-1);
  document.getElementById('b-like').onclick=()=>decide(top.id,'like',c,1);
  document.getElementById('b-res').onclick=()=>decide(top.id,'reserve',c,0);
  drag(c,top.id);
  const pb=c.querySelector('[data-play]');if(pb){pb.onclick=()=>playIn(c,top);playIn(c,top);}
}
function playIn(card,t){const poster=card.querySelector('.poster');const p=document.createElement('div');p.className='player';
 p.innerHTML=`<iframe src="${embedUrl(t.url)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(t.title)}"></iframe><a class="out" href="${t.url}" target="_blank" rel="noopener">${t.plat} 앱으로 열기</a>`;
 poster.replaceWith(p);const b=card.querySelector('[data-play]');if(b)b.remove();
 const h=document.createElement('div');h.className='ttl';h.innerHTML=`<b>${esc(t.title)}</b><span>${t.plat} · ${esc(t.views)}</span>`;p.after(h);}
function decide(id,s,el,dir){
  S.status[id]=s;save();
  if(el&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.style.transition='transform .25s ease, opacity .25s';
    el.style.transform=dir?`translateX(${dir*120}%) rotate(${dir*14}deg)`:'translateY(40%) scale(.9)';
    el.style.opacity='0';setTimeout(render,230);
  }else render();
}
function drag(el,id){
  let x0=null,y0=0,dx=0,locked=false;
  const like=el.querySelector('.stamp.like'),nope=el.querySelector('.stamp.nope');
  el.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;x0=e.clientX;y0=e.clientY;dx=0;locked=false;});
  el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!locked){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){locked=true;el.setPointerCapture(e.pointerId);}else if(Math.abs(dy)>10){x0=null;return;}else return;}
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;like.style.opacity=Math.max(0,dx/90);nope.style.opacity=Math.max(0,-dx/90);});
  const end=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>90){decide(id,dx>0?'like':'pass',el,dx>0?1:-1);}else{el.style.transition='transform .2s';el.style.transform='';like.style.opacity=nope.style.opacity=0;setTimeout(()=>el.style.transition='',200);}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

  v.innerHTML=`<div class="sec-h"><h3>예비함</h3><p>찜이 모자랄 때 꺼내 쓰는 후보</p></div>
   ${r.length?`<div class="list">${r.map(t=>itemHTML(t,{prog:`<div class="sub">${esc(t.why)}</div>`,html:`<button class="btn yolk" data-pick="${t.id}">찜</button>`})).join('')}</div>`
     :`<div class="empty"><b>예비함이 비었어요</b>피드에서 '예비함'을 누르면 여기로 와요.</div>`}`;
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.status[b.dataset.pick]='like';save();render();});
}

function openShoot(id){
  const t=byId[id];const c=S.checks[id]=S.checks[id]||{};
  const row=(k,label)=>`<label class="chk${c[k]?' done':''}"><input type="checkbox" id="ck-${id}-${k}" data-k="${k}" ${c[k]?'checked':''}><span>${esc(label)}</span></label>`;
  document.getElementById('panel').innerHTML=`<h3>${esc(t.title)}</h3><div class="sub">음원: ${esc(t.sound)} · <a href="${t.url}" target="_blank" rel="noopener">원본 다시 보기</a></div>
    <div class="lbl">준비물</div>${t.props.length?t.props.map((p,i)=>row('p'+i,p)).join(''):'<div class="sub">따로 필요 없음</div>'}
    <div class="lbl">편집 변형 5개 (원본 1개로)</div>${t.vars.map((p,i)=>row('v'+i,`${i+1}. ${p}`)).join('')}
    <div class="row" style="margin-top:14px"><button class="btn" id="to-res">예비함으로</button><button class="btn" id="to-pass">빼기</button></div>
    <button class="btn yolk close" id="sheet-close">닫기</button>`;
  const sh=document.getElementById('sheet');sh.hidden=false;
  sh.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{c[i.dataset.k]=i.checked;i.closest('.chk').classList.toggle('done',i.checked);save();});
  const close=()=>{sh.hidden=true;render();};
  document.getElementById('sheet-close').onclick=close;
  document.getElementById('to-res').onclick=()=>{S.status[id]='reserve';save();close();};
  document.getElementById('to-pass').onclick=()=>{S.status[id]='pass';save();close();};
  sh.onclick=e=>{if(e.target===sh)close();};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render();});
render();
</script>

</body></html>
