  S.idx=((S.idx||0)%q.length+q.length)%q.length;

  v.innerHTML=`<div class="deck">
    <div class="stack" id="stack"></div>

  const stack=document.getElementById('stack');
  const c=document.createElement('div');c.className='card';c.innerHTML=cardHTML(top);stack.appendChild(c);
  document.getElementById('b-pass').onclick=()=>decide(top.id,'pass',c);
  document.getElementById('b-like').onclick=()=>decide(top.id,'like',c);
  document.getElementById('b-res').onclick=()=>decide(top.id,'reserve',c);

}

function drag(el){
  let x0=null,y0=0,dx=0,locked=false;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('a,button'))return;x0=e.clientX;y0=e.clientY;dx=0;locked=false;});
  el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!locked){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){locked=true;el.setPointerCapture(e.pointerId);}else if(Math.abs(dy)>10){x0=null;return;}else return;}
    el.style.transform=`translateX(${dx}px)`;});
  const end=()=>{if(x0===null)return;x0=null;if(locked&&Math.abs(dx)>70){go(dx<0?1:-1,el);}else{el.style.transition='transform .2s';el.style.transform='';setTimeout(()=>el.style.transition='',200);}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

  v.innerHTML=`<div class="sec-h"><h3>주말 촬영 리스트</h3><p>11/28(토)–29(일)</p></div>
   ${p.length?`<div class="list">${p.map(t=>{const [d,tot]=progress(t);return itemHTML(t,{prog:`<div class="prog">촬영 준비 ${d}/${tot}</div>`,html:`<button class="btn yolk" data-shoot="${t.id}">촬영 모드</button>`});}).join('')}</div>`
     :`<div class="empty"><b>아직 찜한 게 없어요</b>피드에서 오른쪽으로 밀거나 '찜'을 누르면 여기 쌓여요.</div>`}
   ${short>0?`<div class="note">원본 38개 목표까지 ${short}개 남았어요. 피드를 다 봤다면 예비함에서 꺼내 채우세요. 이 버전엔 실제 이번 주 트렌드 ${ALL.length}개만 들어 있어요.</div>`:''}
   ${passed.length?`<details class="passed"><summary>패스한 것 ${passed.length}개 (되돌리기)</summary><div class="list" style="margin-top:8px">${passed.map(t=>itemHTML(t,{html:`<button class="btn" data-undo="${t.id}">되돌리기</button>`})).join('')}</div></details>`:''}`;
  v.querySelectorAll('[data-shoot]').forEach(b=>b.onclick=()=>openShoot(b.dataset.shoot));
  v.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{S.status[b.dataset.undo]='new';save();render();});
}
function renderReserve(v){
  const r=ALL.filter(t=>st(t.id)==='reserve');
  v.innerHTML=`<div class="sec-h"><h3>예비함</h3><p>찜이 모자랄 때 꺼내 쓰는 후보</p></div>
   ${r.length?`<div class="list">${r.map(t=>itemHTML(t,{prog:`<div class="sub">${esc(t.why)}</div>`,html:`<button class="btn yolk" data-pick="${t.id}">찜</button>`})).join('')}</div>`
     :`<div class="empty"><b>예비함이 비었어요</b>피드에서 '예비함'을 누르면 여기로 와요.</div>`}`;
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.status[b.dataset.pick]='like';save();render();});
}

function openShoot(id){
  const t=byId[id];const c=S.checks[id]=S.checks[id]||{};
  const row=(k,label)=>`<label class="chk${c[k]?' done':''}"><input type="checkbox" id="ck-${id}-${k}" data-k="${k}" ${c[k]?'checked':''}><span>${esc(label)}</span></label>`;
  document.getElementById('panel').innerHTML=`<h3>${esc(t.title)}</h3><div class="sub">음원: ${esc(t.sound)} · <a href="${t.url}" target="_blank" rel="noopener">원본 다시 보기</a></div>
    <div class="lbl">준비물</div>${t.props.length?t.props.map((p,i)=>row('p'+i,p)).join(''):'<div class="sub">따로 필요 없음</div>'}
    <div class="lbl">편집 변형 5개 (원본 1개로)</div>${t.vars.map((p,i)=>row('v'+i,`${i+1}. ${p}`)).join('')}
    <div style="margin-top:14px">${gearHTML(t).split('</div>\n')[1]||''}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="to-res">예비함으로</button><button class="btn" id="to-pass">빼기</button></div>
    <button class="btn yolk close" id="sheet-close">닫기</button>`;
  const sh=document.getElementById('sheet');sh.hidden=false;
  sh.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{c[i.dataset.k]=i.checked;i.closest('.chk').classList.toggle('done',i.checked);save();});
  const close=()=>{sh.hidden=true;render();};
  document.getElementById('sheet-close').onclick=close;
  document.getElementById('to-res').onclick=()=>{S.status[id]='reserve';save();close();};
  document.getElementById('to-pass').onclick=()=>{S.status[id]='pass';save();close();};
  sh.onclick=e=>{if(e.target===sh)close();};
}
document.addEventListener('click',e=>{const b=e.target.closest('.tcopy');if(!b)return;const done=()=>{b.classList.add('ok');const o=b.textContent;b.textContent='복사됨 ✓  '+o;setTimeout(()=>{b.classList.remove('ok');b.textContent=o},1200)};(navigator.clipboard?navigator.clipboard.writeText(b.textContent):Promise.reject()).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(b);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);});});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render();});
render();
</script>

</body></html>
